[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matone"
version = "1.0.0"
description = "AI-Driven Material Code Harmonization Engine"
authors = [
    {name = "SIH2026 Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "xgboost>=2.1.0",
    "rapidfuzz>=3.9.0",
    "pint>=0.24",
    "regex>=2024.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
